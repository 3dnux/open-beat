name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - claude/music-crossfade-mixing-1t46et
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages (subpath base href)
        run: npm run build -- --base-href=/open-beat/

      - name: SPA fallback and Jekyll bypass
        run: |
          cp dist/heyDj/browser/index.html dist/heyDj/browser/404.html
          touch dist/heyDj/browser/.nojekyll

      # Strategy A: publish to the gh-pages branch (covers the
      # "Deploy from a branch" Pages source)
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/heyDj/browser
          force_orphan: true

      # Strategy B: direct Actions deployment (covers the
      # "GitHub Actions" Pages source). Skipped gracefully if the Pages
      # site does not exist yet.
      - name: Configure Pages
        id: cfg
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: steps.cfg.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/heyDj/browser

      - name: Deploy to Pages
        if: steps.cfg.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # Strategy C: root-domain build for external hosting (Hostinger).
      # Deploy the "hostinger" branch via hPanel > Git onto the subdomain.
      - name: Build for Hostinger (root base href)
        run: npm run build -- --base-href=/ --output-path=dist/hostinger

      - name: Add SPA .htaccess for Apache
        run: |
          cat > dist/hostinger/browser/.htaccess <<'EOF'
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          AddType audio/mpeg .mp3
          EOF

      - name: Publish to hostinger branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/hostinger/browser
          publish_branch: hostinger
          force_orphan: true
