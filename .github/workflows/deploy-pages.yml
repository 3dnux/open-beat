name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - claude/music-crossfade-mixing-1t46et
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (generates the music manifest via prebuild)
        run: npm run build -- --base-href=/open-beat/

      - name: SPA fallback
        run: cp dist/heyDj/browser/index.html dist/heyDj/browser/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/heyDj/browser

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
