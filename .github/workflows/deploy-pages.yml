name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - claude/music-crossfade-mixing-1t46et
      - main

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (generates the music manifest via prebuild)
        run: npm run build -- --base-href=/open-beat/

      - name: SPA fallback and Jekyll bypass
        run: |
          cp dist/heyDj/browser/index.html dist/heyDj/browser/404.html
          touch dist/heyDj/browser/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/heyDj/browser
          force_orphan: true
