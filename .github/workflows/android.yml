name: Android APK

on:
  push:
    branches: ['**']
    paths: ['src/**', 'scripts/**', 'android/**', 'package.json', 'package-lock.json', 'capacitor.config.ts', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Build web bundle for the app
        run: node scripts/build-standalone.mjs --app
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: librero-bionico-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
