<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cenizas del Abismo</title>
<style>
  html,body{margin:0;height:100%;background:#050205;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#d8c8a8}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050205}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;display:block}
  #touch{position:fixed;inset:0;pointer-events:none;display:none}
  .btn{position:absolute;width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,190,120,.55);background:rgba(70,10,12,.5);color:#f0d8b0;font:bold 15px Georgia,serif;display:flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:none}
  .btn:active{background:rgba(160,30,30,.7)}
  @media (pointer:coarse){#touch{display:block}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="touch">
  <div class="btn" id="tl" style="left:18px;bottom:24px">◀</div>
  <div class="btn" id="tr" style="left:98px;bottom:24px">▶</div>
  <div class="btn" id="tf" style="right:250px;bottom:24px">FRASCO</div>
  <div class="btn" id="tk" style="right:170px;bottom:24px">RODAR</div>
  <div class="btn" id="tj" style="right:90px;bottom:24px">SALTO</div>
  <div class="btn" id="ta" style="right:18px;bottom:70px">ATAQUE</div>
</div>
<script>
(()=>{
'use strict';
// ───────────────────────── Setup ─────────────────────────
const VW=960,VH=540;
const cv=document.getElementById('c');cv.width=VW;cv.height=VH;
const ctx=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/VW,innerHeight/VH);cv.style.width=Math.floor(VW*s)+'px';cv.style.height=Math.floor(VH*s)+'px';}
addEventListener('resize',fit);fit();

const LEVEL_W=1800,GROUND=430,GRAV=1750;
const PLATS=[{x:430,y:326,w:150,h:16},{x:1220,y:326,w:150,h:16}];
const BOSS_NAME='AZKAROTH, DEVORADOR DE PENITENTES';

// ───────────────────────── Utils ─────────────────────────
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const approach=(v,t,a)=>v<t?Math.min(v+a,t):Math.max(v-a,t);
const lerp=(a,b,t)=>a+(b-a)*t;
const overlap=(a,b)=>!!a&&!!b&&a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const sgn=v=>v<0?-1:1;
function srand(s){s=(s>>>0)||1;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
const ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;
const easeOut=t=>1-(1-t)*(1-t)*(1-t);
const easeIn=t=>t*t*t;
// cinemática inversa de dos huesos: devuelve la rodilla/codo
function ik2(hx,hy,fx,fy,l1,l2,bend){let dx=fx-hx,dy=fy-hy,d=Math.hypot(dx,dy);const m=l1+l2-.5;if(d>m){dx*=m/d;dy*=m/d;d=m;}if(d<1e-3)return{x:hx,y:hy-l1};
  const a=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));const th=Math.atan2(dy,dx);const ang=th-a*bend;return{x:hx+Math.cos(ang)*l1,y:hy+Math.sin(ang)*l1};}

// ───────────────────────── Input ─────────────────────────
const keys={},pressed={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',ArrowDown:'down',KeyS:'down',
  KeyJ:'attack',KeyX:'attack',KeyZ:'attack',KeyK:'roll',ShiftLeft:'roll',ShiftRight:'roll',KeyC:'roll',KeyQ:'flask',KeyF:'flask',Enter:'start'};
addEventListener('keydown',e=>{const a=KEYMAP[e.code];if(a){if(!keys[a])pressed[a]=true;keys[a]=true;e.preventDefault();}audioInit();});
addEventListener('keyup',e=>{const a=KEYMAP[e.code];if(a)keys[a]=false;});
function bindTouch(id,action){const el=document.getElementById(id);
  const on=e=>{e.preventDefault();if(!keys[action])pressed[action]=true;keys[action]=true;audioInit();};
  const off=e=>{e.preventDefault();keys[action]=false;};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);}
bindTouch('tl','left');bindTouch('tr','right');bindTouch('tj','jump');bindTouch('ta','attack');bindTouch('tk','roll');bindTouch('tf','flask');
cv.addEventListener('pointerdown',()=>{audioInit();if(G.state!=='play')pressed.start=true;});

// ───────────────────────── Audio (sintetizado) ─────────────────────────
let AC=null,master=null,noiseBuffer=null;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.4;master.connect(AC.destination);
  noiseBuffer=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;ambient();}catch(e){AC=null;}}
function ambient(){const o1=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter(),lfo=AC.createOscillator(),lg=AC.createGain();
  o1.type='sawtooth';o1.frequency.value=48;o2.type='sawtooth';o2.frequency.value=72.2;f.type='lowpass';f.frequency.value=130;g.gain.value=.17;
  lfo.frequency.value=.11;lg.gain.value=40;lfo.connect(lg);lg.connect(f.frequency);o1.connect(f);o2.connect(f);f.connect(g);g.connect(master);o1.start();o2.start();lfo.start();
  const n=AC.createBufferSource();n.buffer=noiseBuffer;n.loop=true;const nf=AC.createBiquadFilter();nf.type='lowpass';nf.frequency.value=280;const ng=AC.createGain();ng.gain.value=.05;n.connect(nf);nf.connect(ng);ng.connect(master);n.start();}
function tone(type,f0,f1,dur,vol,opt={}){if(!AC)return;const t=AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);let node=o;if(opt.lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=opt.lp;o.connect(fl);node=fl;}
  if(opt.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=opt.vib;lg.gain.value=opt.vibAmt||10;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur);}
  node.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function noise(dur,vol,type,f0,f1,q){if(!AC)return;const t=AC.currentTime;const n=AC.createBufferSource();n.buffer=noiseBuffer;const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(f0||1000,t);f.frequency.exponentialRampToValueAtTime(f1||f0||1000,t+dur);f.Q.value=q||1;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);n.connect(f);f.connect(g);g.connect(master);n.start(t);n.stop(t+dur+.02);}
function sfx(k){if(!AC)return;switch(k){
  case 'swing':noise(.16,.5,'bandpass',600,2800,1.2);break;
  case 'bigswing':noise(.3,.7,'bandpass',200,1400,.8);tone('sine',90,40,.3,.3);break;
  case 'hit':tone('sine',150,40,.16,.6);noise(.1,.5,'highpass',2000,4000);break;
  case 'hit3':tone('sine',110,30,.32,.9);noise(.22,.7,'bandpass',600,200);break;
  case 'hurt':tone('square',220,70,.28,.35,{lp:900});noise(.15,.3,'lowpass',800,200);break;
  case 'jump':tone('sine',280,560,.13,.18);break;
  case 'land':noise(.1,.25,'lowpass',500,150);break;
  case 'roll':noise(.22,.3,'lowpass',700,200);break;
  case 'dodge':tone('sine',900,1800,.25,.25);noise(.2,.3,'highpass',3000,6000);break;
  case 'roar':tone('sawtooth',62,40,1.3,.75,{lp:380,vib:8,vibAmt:16});noise(1.1,.4,'lowpass',450,120);tone('square',31,25,1.3,.3,{lp:200});break;
  case 'roar2':tone('sawtooth',90,55,.5,.6,{lp:500,vib:14,vibAmt:20});break;
  case 'growl':tone('sawtooth',45,38,.7,.35,{lp:220,vib:20,vibAmt:8});break;
  case 'snap':tone('square',400,60,.12,.5,{lp:1500});noise(.12,.5,'bandpass',1200,300);break;
  case 'slam':tone('sine',80,18,.6,.9);noise(.45,.7,'lowpass',600,80);break;
  case 'boom':tone('sine',120,25,.4,.6);noise(.35,.6,'lowpass',900,150);break;
  case 'fire':noise(1.4,.5,'lowpass',900,500,.5);break;
  case 'flask':tone('sine',440,660,.25,.2);tone('sine',660,990,.35,.18);break;
  case 'stagger':tone('square',900,180,.5,.3,{lp:2000});noise(.4,.4,'bandpass',3000,800);tone('sawtooth',70,40,.9,.4,{lp:300});break;
  case 'dead':tone('sawtooth',160,40,2.2,.5,{lp:600});break;
  case 'win':[262,330,392,523].forEach((f,i)=>setTimeout(()=>tone('triangle',f,f,1.2,.25),i*160));break;
}}

// ───────────────────────── Estado ─────────────────────────
const G={state:'title',time:0,shake:0,hitstop:0,cam:{x:0},zoom:1,zoomT:1,slow:1,slowT:0,parts:[],nums:[],slashes:[],ghosts:[],msg:null,endT:0,fightT:0,hint:0,flash:0};
const P={},B={};
function resetPlayer(){Object.assign(P,{x:260,y:GROUND-64,w:26,h:64,vx:0,vy:0,face:1,onGround:false,state:'free',t:0,anim:0,cycle:0,lean:0,hp:100,maxhp:100,flasks:3,inv:0,attackN:0,hitDone:false,queued:false,rollCd:0,coyote:0,jbuf:0,dead:false,deadT:0,healed:false,landT:0,squash:0,skid:0,pd:false,ghostT:0,hits:0,stomp:false,capeX:0,capeY:0,capeVX:0,capeVY:0});}
function resetBoss(){Object.assign(B,{x:1350,y:GROUND-250,w:190,h:250,vx:0,vy:0,hp:1600,maxhp:1600,face:-1,state:'intro',t:0,anim:0,phase:1,stag:0,stagMax:300,flash:0,flinch:0,armA:0,mouth:0,crouch:0,lean:0,lunge:0,headA:-.15,headT:-.15,tailA:0,tele:false,attack:null,cool:1.2,hitbox:null,breath:null,shock:[],meteors:[],onGround:true,lastAttack:null,hitsTaken:0,growlT:2,walkCycle:0,r:false});}
function startGame(){resetPlayer();resetBoss();G.state='play';G.parts=[];G.nums=[];G.slashes=[];G.ghosts=[];G.msg=null;G.fightT=0;G.hint=5;G.zoom=1;G.zoomT=1;G.slow=1;G.slowT=0;G.cam.x=clamp(P.x-VW/2,0,LEVEL_W-VW);message('QUE COMIENCE LA PENITENCIA',2);}
function message(text,dur,col,small){G.msg={text,t:0,dur:dur||2,col:col||'#e8c66a',small:!!small};}
function clearPressed(){for(const k in pressed)pressed[k]=false;}
function slowmo(f,t){G.slow=Math.min(G.slow,f);G.slowT=Math.max(G.slowT,t);}

// ───────────────────────── Partículas ─────────────────────────
function burst(x,y,n,cols,sp,life,g,size,opt={}){for(let i=0;i<n;i++){const a=opt.dir!==undefined?opt.dir+rnd(-(opt.spread||.6),(opt.spread||.6)):rnd(0,Math.PI*2);const s=rnd(sp*.3,sp);
  G.parts.push({x,y,vx:Math.cos(a)*s+(opt.vx||0),vy:Math.sin(a)*s+(opt.vy||0),life:rnd(life*.5,life),max:life,col:cols[(Math.random()*cols.length)|0],size:rnd(size*.5,size),g:g||0,shrink:opt.shrink!==false,fric:opt.fric||1,streak:!!opt.streak});}}
function smoke(x,y,n){for(let i=0;i<n;i++)G.parts.push({x:x+rnd(-20,20),y:y+rnd(-10,10),vx:rnd(-12,12),vy:rnd(-25,-55),life:rnd(1,2),max:2,col:Math.random()<.5?'rgba(30,4,10,.5)':'rgba(70,10,16,.4)',size:rnd(14,26),g:0,shrink:false,grow:true,behind:true,fric:.99});}
function updateParticles(dt){const ps=G.parts;for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.life-=dt;if(p.life<=0){ps[i]=ps[ps.length-1];ps.pop();continue;}p.vy+=p.g*dt;p.vx*=p.fric;p.vy*=p.fric;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.g>0&&p.y>GROUND-1&&p.x>0&&p.x<LEVEL_W){p.y=GROUND-1;p.vy*=-.3;p.vx*=.6;}}
  const ns=G.nums;for(let i=ns.length-1;i>=0;i--){const n=ns[i];n.t+=dt;n.y-=40*dt;if(n.t>n.dur){ns[i]=ns[ns.length-1];ns.pop();}}
  const ss=G.slashes;for(let i=ss.length-1;i>=0;i--){ss[i].t+=dt;if(ss[i].t>.22)ss.splice(i,1);}
  const gh=G.ghosts;for(let i=gh.length-1;i>=0;i--){gh[i].life-=dt;if(gh[i].life<=0)gh.splice(i,1);}
  for(let i=0;i<2;i++)G.parts.push({x:G.cam.x+rnd(-50,VW+50),y:rnd(GROUND+30,VH+20),vx:rnd(-15,15),vy:rnd(-25,-70),life:rnd(2,4.5),max:4.5,col:Math.random()<.3?'#ffd070':'#ff7a1a',size:rnd(1.5,3),g:0,shrink:true,fric:1,ember:true});}
function num(x,y,text,col,big){G.nums.push({x,y,text,col,t:0,dur:.9,big:!!big});}

// ───────────────────────── Jugador ─────────────────────────
const prect=()=>({x:P.x,y:P.y,w:P.w,h:P.h});
function startAttack(n){P.state='attack';P.t=0;P.attackN=n;P.hitDone=false;P.queued=false;P.stomp=false;sfx(n===3?'bigswing':'swing');if(P.onGround)P.vx=P.face*(n===3?190:n===2?70:120);}
function attackRect(){const n=P.attackN;const w=n===3?110:88,h=n===3?96:76;const y=n===3?P.y-28:P.y-12;return P.face>0?{x:P.x+P.w-6,y,w,h}:{x:P.x+6-w,y,w,h};}
function attackActive(){const t=P.t,n=P.attackN;return n===3?(t>=.2&&t<=.38):n===2?(t>=.08&&t<=.22):(t>=.06&&t<=.2);}
function plungeRect(){return {x:P.x-16,y:P.y+P.h-20,w:P.w+32,h:46};}
function snapshot(){return {x:P.x,y:P.y,w:P.w,h:P.h,face:P.face,state:P.state,t:P.t,anim:P.anim,cycle:P.cycle,lean:P.lean,vx:P.vx,vy:P.vy,onGround:P.onGround,attackN:P.attackN,landT:P.landT,deadT:P.deadT,squash:P.squash,skid:P.skid,capeX:P.capeX,capeY:P.capeY,inv:0,life:.25};}
function perfectDodge(){if(P.pd)return;P.pd=true;slowmo(.25,.28);sfx('dodge');message('¡ESQUIVA PERFECTA!',.9,'#fff6d0',true);B.stag=Math.min(B.stagMax,B.stag+55);G.flash=.25;
  burst(P.x+P.w/2,P.y+P.h/2,14,['#fff6d0','#ffd070'],260,.35,0,3,{streak:true});}
function damagePlayer(d,dir){if(P.dead||P.inv>0)return false;if(P.state==='roll'&&P.t>.03&&P.t<.4){perfectDodge();return false;}
  P.hp-=d;P.inv=.9;P.state='hurt';P.t=0;P.attackN=0;P.vx=dir*260;P.vy=-240;P.onGround=false;G.shake=Math.max(G.shake,9);G.hitstop=Math.max(G.hitstop,.06);G.flash=.12;sfx('hurt');
  burst(P.x+P.w/2,P.y+P.h/2,18,['#c8101a','#8a0a12','#ff3040'],280,.7,900,4,{dir:dir>0?-.4:Math.PI+.4,spread:.8,streak:true});num(P.x+P.w/2,P.y-10,'-'+d,'#ff4a4a');
  if(P.hp<=0){P.hp=0;P.dead=true;P.deadT=0;P.state='dead';sfx('dead');slowmo(.35,.8);}return true;}
function updatePlayer(dt){P.t+=dt;P.anim+=dt;if(P.inv>0)P.inv-=dt;if(P.coyote>0)P.coyote-=dt;if(P.jbuf>0)P.jbuf-=dt;if(P.rollCd>0)P.rollCd-=dt;if(P.landT>0)P.landT-=dt;if(P.skid>0)P.skid-=dt;P.squash=approach(P.squash,0,6*dt);
  P.cycle+=Math.abs(P.vx)*dt*.05;
  {const tx=-clamp(P.vx*P.face,-300,300)*.055-(P.state==='attack'?6:0)-(P.state==='roll'?8:0),ty=clamp(-P.vy*.02,-9,9);
   P.capeVX+=((tx-P.capeX)*140-P.capeVX*14)*dt;P.capeVY+=((ty-P.capeY)*140-P.capeVY*14)*dt;P.capeX+=P.capeVX*dt;P.capeY+=P.capeVY*dt;}
  if(P.dead){P.deadT+=dt;P.vx=approach(P.vx,0,600*dt);if(P.deadT>2.2&&G.state==='play'){G.state='dead';G.endT=0;}}
  else{
    const free=P.state==='free';
    if(pressed.jump)P.jbuf=.12;
    if(pressed.flask&&free&&P.onGround&&P.flasks>0){P.state='heal';P.t=0;P.flasks--;P.healed=false;sfx('flask');}
    if(P.state==='heal'){P.vx=approach(P.vx,0,1500*dt);if(P.t>.55&&!P.healed){P.healed=true;P.hp=Math.min(P.maxhp,P.hp+45);num(P.x+P.w/2,P.y-10,'+45','#7fe36a');burst(P.x+P.w/2,P.y+30,18,['#7fe36a','#c8ffb0'],90,.9,-150,3);}if(P.t>1.0)P.state='free';}
    // rodar
    if(pressed.roll&&P.onGround&&P.rollCd<=0&&(free||(P.state==='attack'&&P.t>.18))){P.state='roll';P.t=0;P.pd=false;const m=(keys.right?1:0)-(keys.left?1:0);if(m)P.face=m;P.vx=P.face*360;P.attackN=0;sfx('roll');burst(P.x+P.w/2,P.y+P.h,8,['#5a3a3a','#3a2a2a'],80,.5,0,3,{dir:-Math.PI/2-P.face*1.2,spread:.6});}
    if(P.state==='roll'){if(P.t>.3)P.vx=approach(P.vx,0,2600*dt);if(P.t>.44){P.state='free';P.rollCd=.1;}}
    // ataque
    if(pressed.attack){if(free){if(P.onGround)startAttack(1);else{P.state='plunge';P.t=0;P.hitDone=false;P.vy=Math.max(P.vy,200);sfx('swing');}}
      else if(P.state==='attack'&&P.t>.12&&P.attackN<3)P.queued=true;}
    if(P.state==='attack'){const dur=P.attackN===3?.62:.4;if(P.onGround)P.vx=approach(P.vx,0,(P.attackN===3&&P.t<.2?300:1100)*dt);
      if(P.attackN===3&&P.t>=.2&&!P.stomp){P.stomp=true;burst(P.x+P.w/2,P.y+P.h,6,['#5a3a3a'],80,.4,0,3);}
      if(attackActive()&&!P.hitDone&&B.state!=='dying'&&overlap(attackRect(),bossBody())){P.hitDone=true;const n=P.attackN;const d=n===3?64:n===2?30:34;const r=attackRect();damageBoss(d,clamp(r.x+r.w*.55,B.x+30,B.x+B.w-30),P.y+P.h/2-10,n===3);}
      if(P.t>dur){if(P.queued&&P.attackN<3)startAttack(P.attackN+1);else{P.state='free';P.attackN=0;}}}
    if(P.state==='plunge'){P.vy=Math.min(P.vy+GRAV*2*dt,1000);const m=(keys.right?1:0)-(keys.left?1:0);P.vx=approach(P.vx,m*120,900*dt);
      if(!P.hitDone&&B.state!=='dying'&&overlap(plungeRect(),bossBody())){P.hitDone=true;damageBoss(48,P.x+P.w/2,P.y+P.h,true);P.vy=-520;P.state='free';}
      if(P.onGround){P.state='free';P.squash=1;G.shake=Math.max(G.shake,5);sfx('land');burst(P.x+P.w/2,P.y+P.h,14,['#5a3a3a','#3a2222','#ff8a2a'],200,.5,300,4,{dir:-Math.PI/2,spread:1.4});}}
    if(P.state==='hurt'&&P.t>.42)P.state='free';
    // movimiento
    const move=(keys.right?1:0)-(keys.left?1:0);
    if(P.state==='free'||(P.state==='attack'&&!P.onGround)){const target=move*250;
      if(P.onGround&&move&&sgn(P.vx)!==move&&Math.abs(P.vx)>140&&P.skid<=0){P.skid=.18;burst(P.x+P.w/2,P.y+P.h,6,['#5a3a3a','#3a2a2a'],70,.4,0,3);}
      P.vx=approach(P.vx,target,(P.onGround?(move?1900:2600):1300)*dt);if(move&&P.state==='free')P.face=move;}
    else if(P.state==='hurt'){P.vx=approach(P.vx,0,500*dt);}
    if(P.jbuf>0&&(P.onGround||P.coyote>0)&&P.state==='free'){P.vy=-620;P.onGround=false;P.coyote=0;P.jbuf=0;P.squash=-.6;sfx('jump');burst(P.x+P.w/2,P.y+P.h,6,['#5a3a3a'],60,.4,0,2,{dir:-Math.PI/2,spread:1.2});}
    if(P.vy<0&&!keys.jump&&P.state==='free')P.vy+=GRAV*1.5*dt;
    // inclinación del torso

function step(rdt){G.time+=rdt;

  if(G.slowT>0)G.slowT-=rdt;else G.slow=approach(G.slow,1,4*rdt);
  const dt=rdt*G.slow;
  G.zoomT=1;G.zoom=lerp(G.zoom,G.zoomT,1-Math.exp(-2.5*rdt));if(G.flash>0)G.flash-=rdt;
  if(G.state==='win'||G.state==='dead'){G.endT+=rdt;updateParticles(dt);if(G.msg)G.msg.t+=rdt;if(G.endT>1.3&&(pressed.start||pressed.attack||pressed.jump))startGame();clearPressed();return;}
  if(G.hitstop>0){G.hitstop-=rdt;return;}
  G.fightT+=dt;if(G.hint>0)G.hint-=rdt;if(G.msg){G.msg.t+=rdt;if(G.msg.t>G.msg.dur+.6)G.msg=null;}
  updatePlayer(dt);updateBoss(dt);updateParticles(dt);
  const tx=clamp(P.x+P.w/2-VW/2+P.face*50+(B.state!=='dying'?clamp((B.x+B.w/2-P.x)*.15,-90,90):0),0,LEVEL_W-VW);G.cam.x+=(tx-G.cam.x)*(1-Math.exp(-6*rdt));

  for(const s of G.slashes){const k=s.t/.22;ctx.save();ctx.translate(s.x,s.y);ctx.scale(s.face,1);ctx.rotate(s.a);ctx.globalAlpha=1-k;ctx.strokeStyle='#fff6e0';ctx.lineWidth=3+(1-k)*3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-s.len/2*(1+k*.3),0);ctx.lineTo(s.len/2*(1+k*.3),0);ctx.stroke();ctx.strokeStyle='#ffb070';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-s.len/2,-4);ctx.lineTo(s.len/2,4);ctx.stroke();ctx.restore();}ctx.globalAlpha=1;
  for(const n of G.nums){const k=n.t/n.dur;ctx.globalAlpha=1-k*k;ctx.font=`bold ${n.big?28:18}px Georgia,serif`;ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle='#1a0508';const sc=n.big?1+Math.max(0,.25-n.t)*2:1;ctx.save();ctx.translate(n.x,n.y);ctx.scale(sc,sc);ctx.strokeText(n.text,0,0);ctx.fillStyle=n.col;ctx.fillText(n.text,0,0);ctx.restore();}ctx.globalAlpha=1;}

// ───────────────────────── Render: UI ─────────────────────────
function frameBar(x,y,w,h,frac,col,hi){ctx.fillStyle='#1a0a0c';ctx.fillRect(x-3,y-3,w+6,h+6);ctx.fillStyle='#0a0405';ctx.fillRect(x,y,w,h);ctx.fillStyle=col;ctx.fillRect(x,y,Math.max(0,w*frac),h);ctx.fillStyle=hi;ctx.fillRect(x,y,Math.max(0,w*frac),Math.max(1,h*.3));
  ctx.strokeStyle='#8a6a3a';ctx.lineWidth=2;ctx.strokeRect(x-3,y-3,w+6,h+6);ctx.fillStyle='#c9a24a';ctx.fillRect(x-7,y-7,4,4);ctx.fillRect(x+w+3,y-7,4,4);ctx.fillRect(x-7,y+h+3,4,4);ctx.fillRect(x+w+3,y+h+3,4,4);}
function text(t,x,y,size,col,align,font){ctx.font=`${font||''} ${size}px Georgia,serif`;ctx.textAlign=align||'center';ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillText(t,x+2,y+2);ctx.fillStyle=col;ctx.fillText(t,x,y);}
function drawUI(){text('GUERRERO',26,22,12,'#c9a24a','left','bold');frameBar(26,30,250,13,P.hp/P.maxhp,'#b3121a','#e04050');
  for(let i=0;i<3;i++){const x=30+i*22,y=54,has=i<P.flasks;ctx.fillStyle=has?'#2a5a2a':'#1a1214';ctx.fillRect(x+3,y,8,4);ctx.fillStyle=has?'#7fe36a':'#2a2024';ctx.beginPath();ctx.moveTo(x+3,y+4);ctx.lineTo(x,y+8);ctx.lineTo(x,y+18);ctx.lineTo(x+14,y+18);ctx.lineTo(x+14,y+8);ctx.lineTo(x+11,y+4);ctx.closePath();ctx.fill();if(has){ctx.fillStyle='#c8ffb0';ctx.fillRect(x+3,y+9,2,6);}}
  if(G.hint>0&&G.state==='play'){ctx.globalAlpha=Math.min(1,G.hint);text('A/D mover · Espacio saltar · J/X atacar (combo x3, en el aire estocada) · K/Shift rodar · Q frasco',VW/2,78,13,'#d8c8a8');ctx.globalAlpha=1;}
  if(B.state!=='intro'||B.t>.6){text(BOSS_NAME,VW/2,VH-48,15,'#e8c66a','center','bold');frameBar(VW/2-270,VH-40,540,11,B.hp/B.maxhp,B.phase===2?'#d81a1a':'#b3121a','#f05050');
    ctx.fillStyle='#0a0405';ctx.fillRect(VW/2-200,VH-22,400,4);ctx.fillStyle=B.state==='stagger'?'#fff1b0':'#d8b860';ctx.fillRect(VW/2-200,VH-22,B.state==='stagger'?400*(1-B.t/2.8):400*B.stag/B.stagMax,4);}
  if(G.msg){const m=G.msg;const a=m.t<.2?m.t/.2:m.t>m.dur?Math.max(0,1-(m.t-m.dur)/.6):1;ctx.globalAlpha=a;text(m.text,VW/2,m.small?VH*.3:VH*.38,m.small?22:34,m.col,'center','bold');ctx.globalAlpha=1;}
  const vg=ctx.createRadialGradient(VW/2,VH/2,VH*.4,VW/2,VH/2,VH*.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.7)');ctx.fillStyle=vg;ctx.fillRect(0,0,VW,VH);
  if(B.phase===2&&G.state==='play'&&B.state!=='dying'){const beat=Math.pow(Math.max(0,Math.sin(B.anim*4.2)),6);ctx.fillStyle=`rgba(120,0,0,${beat*.12})`;ctx.fillRect(0,0,VW,VH);}
  if(P.hp<=30&&!P.dead&&G.state==='play'){const rg=ctx.createRadialGradient(VW/2,VH/2,VH*.4,VW/2,VH/2,VH*.9);rg.addColorStop(0,'rgba(120,0,0,0)');rg.addColorStop(1,`rgba(140,0,0,${.35+Math.sin(G.time*4)*.15})`);ctx.fillStyle=rg;ctx.fillRect(0,0,VW,VH);}
  if(G.flash>0){ctx.fillStyle=`rgba(255,240,220,${G.flash*.6})`;ctx.fillRect(0,0,VW,VH);}}
function drawTitle(){ctx.fillStyle='rgba(5,2,5,.62)';ctx.fillRect(0,0,VW,VH);
  text('CENIZAS DEL ABISMO',VW/2,170,56,'#e8c66a','center','bold');text('Un demo de acción 2D · el guerrero del espadón contra la bestia del infierno',VW/2,206,15,'#c8b090');
  const lines=['A / D  ó  ← →   mover','ESPACIO / W   saltar','J / X   atacar  (encadena 3 golpes · en el aire: estocada descendente)','K / SHIFT   rodar  (invulnerable · atravesar un ataque da ESQUIVA PERFECTA)','Q   beber frasco  (cura 45)'];
  lines.forEach((l,i)=>text(l,VW/2,270+i*28,17,'#d8c8a8'));
  text('Los ataques de la bestia se anuncian con un destello. Llena la barra dorada para aturdirla.',VW/2,428,13,'#a89070');
  if(Math.floor(G.time*2)%2===0)text('PULSA ENTER PARA COMENZAR',VW/2,480,20,'#ff8a3a','center','bold');}
function drawEnd(){const win=G.state==='win';const k=Math.min(1,G.endT/1.2);ctx.fillStyle=win?`rgba(10,6,2,${k*.7})`:`rgba(30,0,0,${k*.75})`;ctx.fillRect(0,0,VW,VH);ctx.globalAlpha=k;
  if(win){text('PENITENCIA CUMPLIDA',VW/2,VH*.42,54,'#e8c66a','center','bold');text('La bestia Azkaroth ha caído. El abismo guarda silencio.',VW/2,VH*.42+40,17,'#d8c8a8');text(`Tiempo: ${G.fightT.toFixed(1)} s   ·   Golpes: ${P.hits}   ·   Frascos restantes: ${P.flasks}`,VW/2,VH*.42+70,15,'#a89070');}
  else{text('HAS CAÍDO',VW/2,VH*.42,64,'#b3121a','center','bold');text('El abismo devora otra alma penitente.',VW/2,VH*.42+40,17,'#d8c8a8');}
  if(G.endT>1.3&&Math.floor(G.time*2)%2===0)text('PULSA ENTER PARA VOLVER A INTENTARLO',VW/2,VH*.72,18,'#ff8a3a','center','bold');ctx.globalAlpha=1;}

function render(){ctx.imageSmoothingEnabled=false;drawSky();
  const sx=G.shake>0?rnd(-G.shake,G.shake):0,sy=G.shake>0?rnd(-G.shake,G.shake)*.6:0;
  ctx.save();ctx.translate(VW/2,VH*.62);ctx.scale(G.zoom,G.zoom);ctx.translate(-VW/2,-VH*.62);ctx.translate(Math.round(-G.cam.x+sx),Math.round(sy));
  layer(.1,drawFarMountains);layer(.35,drawMid);layer(.65,drawNear);drawGround();
  drawHazards();
  if(G.state!=='title'){drawSmoke();drawBoss();drawPlayer();}
  drawParticles();
  ctx.restore();
  if(G.state==='title')drawTitle();else{drawUI();if(G.state==='win'||G.state==='dead')drawEnd();}}

G.cam.x=400;resetPlayer();resetBoss();
requestAnimationFrame(frame);
})();
</script>
