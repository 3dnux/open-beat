<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cenizas del Abismo</title>
<style>
  html,body{margin:0;height:100%;background:#050205;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#d8c8a8}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050205}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;display:block}
  #touch{position:fixed;inset:0;pointer-events:none;display:none}
  .btn{position:absolute;width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,190,120,.55);background:rgba(70,10,12,.5);color:#f0d8b0;font:bold 15px Georgia,serif;display:flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:none}
  .btn:active{background:rgba(160,30,30,.7)}
  @media (pointer:coarse){#touch{display:block}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="touch">
  <div class="btn" id="tl" style="left:18px;bottom:24px">◀</div>
  <div class="btn" id="tr" style="left:98px;bottom:24px">▶</div>
  <div class="btn" id="tf" style="right:250px;bottom:24px">FRASCO</div>
  <div class="btn" id="tk" style="right:170px;bottom:24px">RODAR</div>
  <div class="btn" id="tj" style="right:90px;bottom:24px">SALTO</div>
  <div class="btn" id="ta" style="right:18px;bottom:70px">ATAQUE</div>
</div>
<script>
(()=>{
'use strict';
// ───────────────────────── Setup ─────────────────────────
const VW=960,VH=540;
const cv=document.getElementById('c');cv.width=VW;cv.height=VH;
const ctx=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/VW,innerHeight/VH);cv.style.width=Math.floor(VW*s)+'px';cv.style.height=Math.floor(VH*s)+'px';}
addEventListener('resize',fit);fit();

const LEVEL_W=1800,GROUND=430,GRAV=1700;
const PLATS=[{x:430,y:326,w:150,h:16},{x:1220,y:326,w:150,h:16}];
const BOSS_NAME='AZKAROTH, DEVORADOR DE PENITENTES';

// ───────────────────────── Utils ─────────────────────────
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const approach=(v,t,a)=>v<t?Math.min(v+a,t):Math.max(v-a,t);
const overlap=(a,b)=>!!a&&!!b&&a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const sgn=v=>v<0?-1:1;
function srand(s){s=(s>>>0)||1;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
const ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;

// ───────────────────────── Input ─────────────────────────
const keys={},pressed={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',
  KeyJ:'attack',KeyX:'attack',KeyZ:'attack',KeyK:'roll',ShiftLeft:'roll',ShiftRight:'roll',KeyC:'roll',KeyQ:'flask',KeyF:'flask',Enter:'start'};
addEventListener('keydown',e=>{const a=KEYMAP[e.code];if(a){if(!keys[a])pressed[a]=true;keys[a]=true;e.preventDefault();}audioInit();});
addEventListener('keyup',e=>{const a=KEYMAP[e.code];if(a)keys[a]=false;});
function bindTouch(id,action){const el=document.getElementById(id);
  const on=e=>{e.preventDefault();if(!keys[action])pressed[action]=true;keys[action]=true;audioInit();};
  const off=e=>{e.preventDefault();keys[action]=false;};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);}
bindTouch('tl','left');bindTouch('tr','right');bindTouch('tj','jump');bindTouch('ta','attack');bindTouch('tk','roll');bindTouch('tf','flask');
cv.addEventListener('pointerdown',()=>{audioInit();if(G.state!=='play')pressed.start=true;});

// ───────────────────────── Audio (sintetizado) ─────────────────────────
let AC=null,master=null,noiseBuffer=null;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.4;master.connect(AC.destination);
  noiseBuffer=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;ambient();}catch(e){AC=null;}}
function ambient(){const o1=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter(),lfo=AC.createOscillator(),lg=AC.createGain();
  o1.type='sawtooth';o1.frequency.value=55;o2.type='sawtooth';o2.frequency.value=82.4;f.type='lowpass';f.frequency.value=140;g.gain.value=.16;
  lfo.frequency.value=.12;lg.gain.value=40;lfo.connect(lg);lg.connect(f.frequency);o1.connect(f);o2.connect(f);f.connect(g);g.connect(master);o1.start();o2.start();lfo.start();
  const n=AC.createBufferSource();n.buffer=noiseBuffer;n.loop=true;const nf=AC.createBiquadFilter();nf.type='lowpass';nf.frequency.value=300;const ng=AC.createGain();ng.gain.value=.05;n.connect(nf);nf.connect(ng);ng.connect(master);n.start();}
function tone(type,f0,f1,dur,vol,opt={}){if(!AC)return;const t=AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);let node=o;if(opt.lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=opt.lp;o.connect(fl);node=fl;}
  if(opt.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=opt.vib;lg.gain.value=opt.vibAmt||10;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur);}
  node.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function noise(dur,vol,type,f0,f1,q){if(!AC)return;const t=AC.currentTime;const n=AC.createBufferSource();n.buffer=noiseBuffer;const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(f0||1000,t);f.frequency.exponentialRampToValueAtTime(f1||f0||1000,t+dur);f.Q.value=q||1;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);n.connect(f);f.connect(g);g.connect(master);n.start(t);n.stop(t+dur+.02);}
function sfx(k){if(!AC)return;switch(k){
  case 'swing':noise(.18,.5,'bandpass',500,2600,1.2);break;
  case 'bigswing':noise(.32,.7,'bandpass',200,1400,.8);tone('sine',90,40,.3,.3);break;
  case 'hit':tone('sine',150,40,.16,.6);noise(.1,.5,'highpass',2000,4000);break;
  case 'hit3':tone('sine',110,30,.3,.8);noise(.2,.7,'bandpass',600,200);break;
  case 'hurt':tone('square',220,70,.28,.35,{lp:900});noise(.15,.3,'lowpass',800,200);break;
  case 'jump':tone('sine',280,560,.13,.18);break;
  case 'roll':noise(.22,.3,'lowpass',700,200);break;
  case 'roar':tone('sawtooth',70,45,1.1,.7,{lp:420,vib:9,vibAmt:14});noise(.9,.35,'lowpass',500,150);break;
  case 'roar2':tone('sawtooth',90,60,.5,.6,{lp:500,vib:14,vibAmt:20});break;
  case 'slam':tone('sine',80,18,.6,.9);noise(.45,.7,'lowpass',600,80);break;
  case 'boom':tone('sine',120,25,.4,.6);noise(.35,.6,'lowpass',900,150);break;
  case 'fire':noise(1.4,.5,'lowpass',900,500,.5);break;
  case 'flask':tone('sine',440,660,.25,.2);tone('sine',660,990,.35,.18);break;
  case 'stagger':tone('square',900,180,.5,.3,{lp:2000});noise(.4,.4,'bandpass',3000,800);break;
  case 'dead':tone('sawtooth',160,40,2.2,.5,{lp:600});break;
  case 'win':[262,330,392,523].forEach((f,i)=>setTimeout(()=>tone('triangle',f,f,1.2,.25),i*160));break;
}}

// ───────────────────────── Estado ─────────────────────────
const G={state:'title',time:0,shake:0,hitstop:0,cam:{x:0},parts:[],nums:[],msg:null,endT:0,fightT:0,hint:0};
const P={},B={};
function resetPlayer(){Object.assign(P,{x:260,y:GROUND-64,w:26,h:64,vx:0,vy:0,face:1,onGround:false,state:'free',t:0,anim:0,hp:100,maxhp:100,flasks:3,inv:0,attackN:0,hitDone:false,queued:false,rollCd:0,coyote:0,jbuf:0,dead:false,deadT:0,healed:false,landT:0});}
function resetBoss(){Object.assign(B,{x:1350,y:GROUND-250,w:190,h:250,vx:0,vy:0,hp:1500,maxhp:1500,face:-1,state:'intro',t:0,anim:0,phase:1,stag:0,stagMax:280,flash:0,armA:0,mouth:0,crouch:0,lean:0,tele:false,attack:null,cool:1.4,hitbox:null,breath:null,shock:[],meteors:[],onGround:true,lastAttack:null});}
function startGame(){resetPlayer();resetBoss();G.state='play';G.parts=[];G.nums=[];G.msg=null;G.fightT=0;G.hint=5;G.cam.x=clamp(P.x-VW/2,0,LEVEL_W-VW);message('QUE COMIENCE LA PENITENCIA',2);}
function message(text,dur,col){G.msg={text,t:0,dur:dur||2,col:col||'#e8c66a'};}
function clearPressed(){for(const k in pressed)pressed[k]=false;}

// ───────────────────────── Partículas ─────────────────────────
function burst(x,y,n,cols,sp,life,g,size,opt={}){for(let i=0;i<n;i++){const a=opt.dir!==undefined?opt.dir+rnd(-opt.spread||-.6,opt.spread||.6):rnd(0,Math.PI*2);const s=rnd(sp*.3,sp);
  G.parts.push({x,y,vx:Math.cos(a)*s+(opt.vx||0),vy:Math.sin(a)*s+(opt.vy||0),life:rnd(life*.5,life),max:life,col:cols[(Math.random()*cols.length)|0],size:rnd(size*.5,size),g:g||0,shrink:opt.shrink!==false,fric:opt.fric||1});}}
function updateParticles(dt){const ps=G.parts;for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.life-=dt;if(p.life<=0){ps[i]=ps[ps.length-1];ps.pop();continue;}p.vy+=p.g*dt;p.vx*=p.fric;p.vy*=p.fric;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.g>0&&p.y>GROUND-1&&p.x>0&&p.x<LEVEL_W){p.y=GROUND-1;p.vy*=-.3;p.vx*=.6;}}
  const ns=G.nums;for(let i=ns.length-1;i>=0;i--){const n=ns[i];n.t+=dt;n.y-=40*dt;if(n.t>n.dur){ns[i]=ns[ns.length-1];ns.pop();}}
  // brasas ambientales
  for(let i=0;i<2;i++)G.parts.push({x:G.cam.x+rnd(-50,VW+50),y:rnd(GROUND+30,VH+20),vx:rnd(-15,15),vy:rnd(-25,-70),life:rnd(2,4.5),max:4.5,col:Math.random()<.3?'#ffd070':'#ff7a1a',size:rnd(1.5,3),g:0,shrink:true,fric:1,ember:true});}
function num(x,y,text,col,big){G.nums.push({x,y,text,col,t:0,dur:.9,big:!!big});}

// ───────────────────────── Jugador ─────────────────────────
const prect=()=>({x:P.x,y:P.y,w:P.w,h:P.h});
function startAttack(n){P.state='attack';P.t=0;P.attackN=n;P.hitDone=false;P.queued=false;sfx(n===3?'bigswing':'swing');if(P.onGround)P.vx=P.face*(n===3?150:90);}
function attackRect(){const n=P.attackN;const w=n===3?104:84,h=n===3?92:74;const y=n===3?P.y-26:P.y-10;return P.face>0?{x:P.x+P.w-6,y,w,h}:{x:P.x+6-w,y,w,h};}
function attackActive(){const t=P.t,n=P.attackN;return n===3?(t>=.16&&t<=.36):(t>=.07&&t<=.22);}
function damagePlayer(d,dir){if(P.dead||P.inv>0)return false;if(P.state==='roll'&&P.t>.03&&P.t<.38){return false;}
  P.hp-=d;P.inv=.9;P.state='hurt';P.t=0;P.attackN=0;P.vx=dir*240;P.vy=-230;P.onGround=false;G.shake=Math.max(G.shake,8);G.hitstop=Math.max(G.hitstop,.05);sfx('hurt');
  burst(P.x+P.w/2,P.y+P.h/2,16,['#c8101a','#8a0a12','#ff3040'],260,.7,900,4);num(P.x+P.w/2,P.y-10,'-'+d,'#ff4a4a');
  if(P.hp<=0){P.hp=0;P.dead=true;P.deadT=0;P.state='dead';sfx('dead');}return true;}
function updatePlayer(dt){P.t+=dt;P.anim+=dt;if(P.inv>0)P.inv-=dt;if(P.coyote>0)P.coyote-=dt;if(P.jbuf>0)P.jbuf-=dt;if(P.rollCd>0)P.rollCd-=dt;if(P.landT>0)P.landT-=dt;
  if(P.dead){P.deadT+=dt;P.vx=approach(P.vx,0,600*dt);if(P.deadT>2.2&&G.state==='play'){G.state='dead';G.endT=0;}}
  else{
    const free=P.state==='free';
    if(pressed.jump)P.jbuf=.12;
    // frasco
    if(pressed.flask&&free&&P.onGround&&P.flasks>0){P.state='heal';P.t=0;P.flasks--;P.healed=false;sfx('flask');}
    if(P.state==='heal'){P.vx=approach(P.vx,0,1500*dt);if(P.t>.55&&!P.healed){P.healed=true;P.hp=Math.min(P.maxhp,P.hp+45);num(P.x+P.w/2,P.y-10,'+45','#7fe36a');burst(P.x+P.w/2,P.y+30,18,['#7fe36a','#c8ffb0'],90,.9,-150,3);}if(P.t>1.0)P.state='free';}
    // rodar
    if(pressed.roll&&P.onGround&&P.rollCd<=0&&(free||(P.state==='attack'&&P.t>.2))){P.state='roll';P.t=0;const m=(keys.right?1:0)-(keys.left?1:0);if(m)P.face=m;P.vx=P.face*340;P.attackN=0;sfx('roll');burst(P.x+P.w/2,P.y+P.h,6,['#5a3a3a','#3a2a2a'],60,.5,0,3);}
    if(P.state==='roll'){if(P.t>.3)P.vx=approach(P.vx,0,2400*dt);if(P.t>.42){P.state='free';P.rollCd=.12;}}
    // ataque
    if(pressed.attack){if(free){startAttack(1);}else if(P.state==='attack'&&P.t>.15&&P.attackN<3)P.queued=true;}
    if(P.state==='attack'){const dur=P.attackN===3?.6:.4;if(P.onGround)P.vx=approach(P.vx,0,900*dt);
      if(attackActive()&&!P.hitDone&&B.state!=='dying'&&overlap(attackRect(),bossBody())){P.hitDone=true;const n=P.attackN;const d=n===3?62:32;const r=attackRect();damageBoss(d,r.x+r.w/2,P.y+P.h/2,n===3);}
      if(P.t>dur){if(P.queued&&P.attackN<3)startAttack(P.attackN+1);else{P.state='free';P.attackN=0;}}}
    if(P.state==='hurt'&&P.t>.4)P.state='free';
    // movimiento
    const move=(keys.right?1:0)-(keys.left?1:0);
    if(P.state==='free'||(P.state==='attack'&&!P.onGround)){const target=move*230;P.vx=approach(P.vx,target,(P.onGround?2600:1400)*dt);if(move&&P.state==='free')P.face=move;}
    else if(P.state==='hurt'){P.vx=approach(P.vx,0,500*dt);}
    // salto
    if(P.jbuf>0&&(P.onGround||P.coyote>0)&&P.state==='free'){P.vy=-600;P.onGround=false;P.coyote=0;P.jbuf=0;sfx('jump');burst(P.x+P.w/2,P.y+P.h,5,['#5a3a3a'],50,.4,0,2);}
    if(P.vy<0&&!keys.jump&&P.state==='free')P.vy+=GRAV*1.4*dt;
  }
  // física
  P.vy=Math.min(P.vy+GRAV*dt,1000);
  const prevBottom=P.y+P.h;P.x+=P.vx*dt;P.y+=P.vy*dt;P.x=clamp(P.x,6,LEVEL_W-6-P.w);
  const wasGround=P.onGround;P.onGround=false;
  if(P.y+P.h>=GROUND&&P.vy>=0){P.y=GROUND-P.h;P.vy=0;P.onGround=true;}
  else if(P.vy>=0){for(const pl of PLATS){if(prevBottom<=pl.y+1&&P.y+P.h>=pl.y&&P.x+P.w>pl.x+4&&P.x<pl.x+pl.w-4){P.y=pl.y-P.h;P.vy=0;P.onGround=true;break;}}}
  if(P.onGround){P.coyote=.1;if(!wasGround){P.landT=.12;burst(P.x+P.w/2,P.y+P.h,5,['#4a3030'],60,.4,0,2);}}
}

// ───────────────────────── Jefe ─────────────────────────
const bossBody=()=>({x:B.x+28,y:B.y+20+(B.state==='stagger'?40:0),w:B.w-56,h:B.h-20-(B.state==='stagger'?40:0)});
function frontRect(w,h){return B.face>0?{x:B.x+B.w-70,y:GROUND-h,w,h}:{x:B.x+70-w,y:GROUND-h,w,h};}
function mouthPos(){const cx=B.x+B.w/2,fy=B.y+B.h;const st=B.state==='stagger'?40:0;return {x:cx+B.face*105,y:fy-200+st+B.crouch*30};}
function clearAttack(){B.attack=null;B.hitbox=null;B.breath=null;B.tele=false;B.mouth=0;B.armA=0;B.lean=0;B.crouch=0;}
function endAttack(cool){clearAttack();B.state='idle';B.t=0;B.cool=cool;}
function damageBoss(d,x,y,heavy){if(B.state==='dying')return;let dm=d;if(B.state==='stagger')dm=Math.round(d*1.5);B.hp-=dm;B.flash=.12;G.shake=Math.max(G.shake,heavy?9:4);G.hitstop=Math.max(G.hitstop,heavy?.09:.05);sfx(heavy?'hit3':'hit');
  burst(x,y,heavy?22:12,['#5a0a12','#8a1020','#c8202a'],heavy?300:200,.8,800,4,{dir:P.face>0?-.6:Math.PI+.6,spread:.9});burst(x,y,6,['#fff3c0','#ffd070'],320,.25,0,3,{shrink:true});
  num(x,y-20,dm,B.state==='stagger'?'#ffe28a':'#f4e4c8',heavy);
  if(B.hp<=0){B.hp=0;clearAttack();B.state='dying';B.t=0;B.vx=0;sfx('roar');G.shake=18;return;}
  if(B.state!=='stagger'){B.stag+=dm;if(B.stag>=B.stagMax){B.stag=0;clearAttack();B.state='stagger';B.t=0;B.vx=0;sfx('stagger');message('¡ATURDIDO!',1.4,'#fff1b0');G.shake=Math.max(G.shake,10);}}}
function chooseAttack(){const dx=(P.x+P.w/2)-(B.x+B.w/2),dist=Math.abs(dx);B.face=dx>0?1:-1;const p2=B.phase===2;let pool;
  if(dist<300)pool=[['claw',7],['slam',2],['breath',2],['meteor',1]];
  else if(dist<680)pool=[['breath',4],['slam',3],['meteor',2],['claw',1]].concat(p2?[['charge',3]]:[]);
  else pool=[['meteor',3],['slam',3],['breath',1]].concat(p2?[['charge',5]]:[]);
  const f=pool.filter(p=>p[0]!==B.lastAttack);if(f.length)pool=f;
  let tot=pool.reduce((s,p)=>s+p[1],0),r=Math.random()*tot,type=pool[0][0];for(const p of pool){r-=p[1];if(r<=0){type=p[0];break;}}
  B.attack={type,t:0,stage:0,hit:false,t2:0};B.state='attack';B.t=0;B.lastAttack=type;}
function runAttack(dt){const A=B.attack;A.t+=dt;const p2=B.phase===2,sp=p2?.75:1;
  switch(A.type){
  case 'claw':{const W=.85*sp;B.vx=0;
    if(A.t<W){B.armA=-1.7*ease(Math.min(1,A.t/W));B.tele=true;}
    else if(A.t<W+.22){B.tele=false;const k=(A.t-W)/.22;B.armA=-1.7+2.9*k;if(!A.sw){A.sw=true;sfx('bigswing');G.shake=Math.max(G.shake,5);}
      const hb=frontRect(230,185);B.hitbox=hb;if(!A.hit&&overlap(hb,prect())){A.hit=true;damagePlayer(26,B.face);}}
    else{B.hitbox=null;B.armA=approach(B.armA,0,3*dt);if(A.t>W+1.05)endAttack(p2?.7:1.2);}break;}
  case 'slam':{
    if(A.stage===0){B.vx=0;B.crouch=Math.min(1,A.t/.5);B.tele=true;
      if(A.t>=.5){A.stage=1;B.tele=false;B.crouch=0;B.vy=-900;B.onGround=false;B.y-=1;const tx=P.x+P.w/2-B.w/2;const air=2*900/GRAV;B.vx=clamp((tx-B.x)/air,-560,560);sfx('roar2');}}
    else if(A.stage===1){if(B.onGround){A.stage=2;A.t2=0;B.vx=0;G.shake=22;sfx('slam');const feet=B.x+B.w/2;B.face=(P.x+P.w/2)>feet?1:-1;
        burst(feet,GROUND,30,['#5a3a3a','#3a2222','#ff8a2a'],340,.8,600,5,{dir:-Math.PI/2,spread:1.4});
        B.shock.push({x:feet+40,dir:1,t:0,hit:false},{x:feet-40,dir:-1,t:0,hit:false});
        const hb={x:B.x-20,y:GROUND-90,w:B.w+40,h:90};if(overlap(hb,prect()))damagePlayer(24,sgn(P.x+P.w/2-feet));}}
    else{A.t2+=dt;B.crouch=Math.max(0,1-A.t2/.5);if(A.t2>1.0)endAttack(p2?.7:1.1);}break;}

  if(G.state==='win'||G.state==='dead'){G.endT+=dt;updateParticles(dt);if(G.msg)G.msg.t+=dt;if(G.endT>1.3&&(pressed.start||pressed.attack||pressed.jump))startGame();clearPressed();return;}

  ctx.translate(0,86);ctx.rotate(-.45+(B.armA<0?-.3:0));F('#5a1a1e');ctx.fillRect(-14,0,28,96);F('#e8e0d0');for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*11-6,92);ctx.lineTo(i*11+2,134);ctx.lineTo(i*11+6,92);ctx.closePath();ctx.fill();}ctx.restore();

function drawHazards(){for(const s of B.shock){const h=30+Math.sin(G.time*40+s.x)*8;ctx.fillStyle='#ff7a1a';ctx.beginPath();ctx.moveTo(s.x-18,GROUND);ctx.lineTo(s.x-6,GROUND-h*.6);ctx.lineTo(s.x,GROUND-h);ctx.lineTo(s.x+8,GROUND-h*.5);ctx.lineTo(s.x+18,GROUND);ctx.closePath();ctx.fill();ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.moveTo(s.x-8,GROUND);ctx.lineTo(s.x,GROUND-h*.55);ctx.lineTo(s.x+8,GROUND);ctx.closePath();ctx.fill();}
  for(const m of B.meteors){if(m.state==='warn'){const k=clamp((m.t-m.delay)/m.warn,0,1);if(k<=0)continue;const pulse=.4+Math.sin(G.time*18)*.3*k;ctx.strokeStyle=`rgba(255,60,30,${pulse})`;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(m.x,GROUND-2,36*k+6,9,0,0,Math.PI*2);ctx.stroke();ctx.fillStyle=`rgba(255,90,30,${pulse*.35})`;ctx.fill();

function drawParticles(){for(const p of G.parts){const k=p.life/p.max;ctx.globalAlpha=p.ember?Math.min(1,k*2)*.9:Math.min(1,k*3);ctx.fillStyle=p.col;const s=p.shrink?Math.max(1,p.size*k):p.size;ctx.fillRect(p.x-s/2,p.y-s/2,s,s);}ctx.globalAlpha=1;

// ───────────────────────── Render: UI ─────────────────────────
function frameBar(x,y,w,h,frac,col,hi){ctx.fillStyle='#1a0a0c';ctx.fillRect(x-3,y-3,w+6,h+6);ctx.fillStyle='#0a0405';ctx.fillRect(x,y,w,h);ctx.fillStyle=col;ctx.fillRect(x,y,Math.max(0,w*frac),h);ctx.fillStyle=hi;ctx.fillRect(x,y,Math.max(0,w*frac),Math.max(1,h*.3));
  ctx.strokeStyle='#8a6a3a';ctx.lineWidth=2;ctx.strokeRect(x-3,y-3,w+6,h+6);ctx.fillStyle='#c9a24a';ctx.fillRect(x-7,y-7,4,4);ctx.fillRect(x+w+3,y-7,4,4);ctx.fillRect(x-7,y+h+3,4,4);ctx.fillRect(x+w+3,y+h+3,4,4);}

  if(P.hp<=30&&!P.dead&&G.state==='play'){const rg=ctx.createRadialGradient(VW/2,VH/2,VH*.4,VW/2,VH/2,VH*.9);rg.addColorStop(0,'rgba(120,0,0,0)');rg.addColorStop(1,`rgba(140,0,0,${.35+Math.sin(G.time*4)*.15})`);ctx.fillStyle=rg;ctx.fillRect(0,0,VW,VH);}}
function drawTitle(){ctx.fillStyle='rgba(5,2,5,.62)';ctx.fillRect(0,0,VW,VH);
  text('CENIZAS DEL ABISMO',VW/2,170,56,'#e8c66a','center','bold');text('Un demo de acción 2D · el guerrero del espadón contra la bestia del infierno',VW/2,206,15,'#c8b090');

  text('Los ataques de la bestia se anuncian con un destello. Llena la barra dorada para aturdirla.',VW/2,428,13,'#a89070');

function drawEnd(){const win=G.state==='win';const k=Math.min(1,G.endT/1.2);ctx.fillStyle=win?`rgba(10,6,2,${k*.7})`:`rgba(30,0,0,${k*.75})`;ctx.fillRect(0,0,VW,VH);ctx.globalAlpha=k;
  if(win){text('PENITENCIA CUMPLIDA',VW/2,VH*.42,54,'#e8c66a','center','bold');text('La bestia Azkaroth ha caído. El abismo guarda silencio.',VW/2,VH*.42+40,17,'#d8c8a8');text(`Tiempo: ${G.fightT.toFixed(1)} s   ·   Frascos restantes: ${P.flasks}`,VW/2,VH*.42+70,15,'#a89070');}
  else{text('HAS CAÍDO',VW/2,VH*.42,64,'#b3121a','center','bold');text('El abismo devora otra alma penitente.',VW/2,VH*.42+40,17,'#d8c8a8');}
  if(G.endT>1.3&&Math.floor(G.time*2)%2===0)text('PULSA ENTER PARA VOLVER A INTENTARLO',VW/2,VH*.72,18,'#ff8a3a','center','bold');ctx.globalAlpha=1;}

function render(){ctx.imageSmoothingEnabled=false;drawSky();
  const sx=G.shake>0?rnd(-G.shake,G.shake):0,sy=G.shake>0?rnd(-G.shake,G.shake)*.6:0;
  ctx.save();ctx.translate(Math.round(-G.cam.x+sx),Math.round(sy));

G.cam.x=400;resetPlayer();resetBoss();

})();
